name: CI

# Path-filtered (TARGET §8). Backend runs RuboCop + RSpec (100% SimpleCov) and
# the OpenAPI drift check. Frontend jobs stay stubbed until session 0.4.

on:
  push:
    branches: [main, master]
    pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**.md'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            contract:
              - 'backend/**'
              - 'frontend/**'
              - 'docs/SCHEMA_DESIGN.md'

  docs:
    name: Docs check (stub)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder markdown presence check
        run: |
          test -f docs/CONVENTIONS.md
          test -f docs/MASTER_PLAN.md
          test -f docs/SESSION_STARTER.md
          echo "Docs stub OK — link checker arrives later."

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rajya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
          working-directory: backend
      - name: Prepare database
        run: bin/rails db:prepare
      - name: RuboCop
        run: bin/rubocop
      - name: RSpec
        run: bundle exec rspec

  frontend:
    name: Frontend (stub)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Vitest / ESLint / Playwright / tsc wired in session 0.4."
          test -d frontend
          test -f frontend/src/assets/brand/logo_light.png
          test -f frontend/src/assets/brand/logo_dark.png

  contract:
    name: OpenAPI drift
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rajya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
          working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare database
        working-directory: backend
        run: bin/rails db:prepare
      - name: Regenerate contract artefacts
        working-directory: backend
        run: bin/openapi
      - name: Fail on drift
        run: git diff --exit-code -- backend/swagger frontend/src/shared/lib
