name: CI

# Path-filtered (TARGET §8). Backend: RuboCop + RSpec (100% SimpleCov) and
# OpenAPI drift. Frontend: ESLint, Prettier, tsc, Vitest 100%, Playwright.

on:
  push:
    branches: [main, master]
    pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**.md'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            contract:
              - 'backend/**'
              - 'frontend/**'
              - 'docs/SCHEMA_DESIGN.md'

  docs:
    name: Docs check (stub)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder markdown presence check
        run: |
          test -f docs/CONVENTIONS.md
          test -f docs/MASTER_PLAN.md
          test -f docs/SESSION_STARTER.md
          echo "Docs stub OK — link checker arrives later."

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rajya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
          working-directory: backend
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips-dev ffmpeg postgresql-client
      - name: Prepare database
        run: bin/rails db:prepare
      - name: RuboCop
        run: bin/rubocop
      - name: RSpec
        run: bundle exec rspec
      - name: Backup restore drill
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
          BACKUP_DIR: ${{ github.workspace }}/tmp/rajya-backups
        run: |
          mkdir -p tmp/rajya-backups
          chmod +x ops/backups/*.sh
          ./ops/backups/drill.sh

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Prove lint rules
        run: npm run prove:lint
      - name: Vitest
        run: npm test
      - name: Prove coverage gate
        run: npm run prove:coverage-gate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Brand assets
        run: |
          test -f src/assets/brand/logo_light.png
          test -f src/assets/brand/logo_dark.png

  contract:
    name: OpenAPI drift
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rajya_test
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rajya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.3"
          bundler-cache: true
          working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare database
        working-directory: backend
        run: bin/rails db:prepare
      - name: Regenerate contract artefacts
        working-directory: backend
        run: bin/openapi
      - name: Fail on drift
        run: git diff --exit-code -- backend/swagger frontend/src/shared/lib
