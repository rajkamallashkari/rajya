# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To use the information, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # Error taxonomy default copy (app/lib/errors.rb, TARGET_ARCHITECTURE.md §4.6).
  # DB rows in translation_strings override these via Catalog.t.
  errors:
    not_found: "The requested resource could not be found."
    unauthenticated: "You need to sign in to continue."
    forbidden: "You don't have permission to do that."
    validation_failed: "The submitted data is invalid."
    conflict: "This action conflicts with the current state."
    rate_limited: "Too many requests. Please slow down and try again."
    quota_exceeded: "Storage quota exceeded."
    upstream_failed: "An upstream service failed. Please try again."
    models:
      message:
        system_event: "must be present only for system messages"
        sender_required: "or sender_snapshot is required for non-system messages"
      conversation:
        direct_key: "must be present only for direct conversations"
        title: "can't be blank for non-direct conversations"
      conversation_membership:
        seen_position: "must be greater than or equal to last_read_position"
      block:
        self: "can't be the same as the blocking account"
      user:
        account_kind: "must be a human account"
        email_blank: "can't be blank"
        email_taken: "has already been taken"
        name_blank: "can't be blank"
        password_confirmation: "doesn't match password"
        password_too_short: "is too short (minimum is %{count} characters)"
      bot:
        account_kind: "must be a bot account"
      app_setting:
        below_min: "is below the registered minimum"
        above_max: "is above the registered maximum"
        wrong_type: "does not match the registered type"
      theme_override:
        contrast: "would drop contrast below WCAG AA against its paired token"

  mailers:
    auth:
      magic_link:
        subject: "Sign in to Rajya"
        headline: "Sign in to Rajya"
        body: "Hi %{name}, open the link below to sign in. It expires in %{minutes} minutes."
        footer: "If you didn't request this, you can safely ignore this email. This link can only be used once."
      otp:
        subject: "%{otp} – your Rajya code"
        headline: "Your sign-in code"
        body: "Hi %{name}, use the code below to sign in. It expires in %{minutes} minutes."
        footer: "If you didn't request this code, you can safely ignore this email. Never share this code with anyone."
      password_reset:
        subject: "Reset your Rajya password"
        headline: "Reset your password"
        body: "Hi %{name}, open the link below to set a new password. It expires in %{minutes} minutes and can only be used once."
        footer: "If you didn't request a password reset, you can safely ignore this email. Your password will not be changed."

  health:
    redis_unexpected: "Redis did not answer PONG."
    solid_queue_stale: "No Solid Queue process has heartbeated recently."
