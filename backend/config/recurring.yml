production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reconcile_conversation_sidebar:
    class: Conversations::ReconcileSidebarJob
    queue: background
    schedule: every hour at minute 17
  dispatch_message_reminders:
    class: MessageReminders::DispatchDueJob
    queue: default
    schedule: every minute
  reconcile_storage_quotas:
    class: StorageQuotas::ReconcileJob
    queue: background
    schedule: every day at 3:40am
  purge_orphaned_blobs:
    class: StorageQuotas::OrphanedBlobCleanupJob
    queue: background
    schedule: every day at 4:10am
  purge_expired_exports:
    class: ExportJobs::PurgeExpiredJob
    queue: background
    schedule: every day at 4:25am
  check_storage_bucket_health:
    class: StorageBuckets::HealthJob
    queue: background
    schedule: every hour at minute 7
