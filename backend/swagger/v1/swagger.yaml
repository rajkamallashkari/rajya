      tags:
      - AI
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: summarized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Summary"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - unread
                  - recent
  "/api/v1/ai/translate_text":
    post:
      summary: Translate arbitrary text
      tags:
      - AI
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: translated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Translation"
      requestBody:
        content:
          application/json:
            schema:
              type: object
