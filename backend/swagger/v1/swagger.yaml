      - user
      properties:
        token:
          type: string
        account:
          "$ref": "#/components/schemas/Account"
        user:
          "$ref": "#/components/schemas/SessionUser"
    AuthAccepted:
      type: object
      required:
      - accepted
      properties:
        accepted:
          type: boolean
    Ok:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    MessagePreview:
      type: object
      required:
      - id
      - kind
      - created_at
      - deleted
      properties:
        id:
          type: integer
        kind:
          type: string
        body:
          type: string
          nullable: true
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        sender_name:
          type: string
          nullable: true
    ConversationMember:
