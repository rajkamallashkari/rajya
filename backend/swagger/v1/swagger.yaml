      - Messages
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
  "/api/v1/messages/{id}/forward":
    post:
      summary: Forward a message
