      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: translated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Translation"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - target_language
              properties:
                target_language:
                  type: string
                source_language:
                  type: string
                  nullable: true
  "/api/v1/conversations/{id}/suggest_replies":
