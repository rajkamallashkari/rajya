---
openapi: 3.0.1
info:
  title: Rajya API
  version: v1
  description: Rajya HTTP API. Generated from rswag-annotated request specs (TARGET
    §4.5).
paths:
  "/api/v1/accounts/username":
    get:
      summary: Check whether a username is available
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: username
        in: query
        schema:
          type: string
      responses:
        '200':
          description: availability
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UsernameAvailability"
  "/api/v1/accounts/{id}":
    get:
      summary: Show a public profile
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: visible
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '404':
          description: blocked reverse (NR-1 invisibility)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/admin/settings":
    get:
      summary: List registry settings with current values
      tags:
      - Admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSettingList"
    patch:
      summary: Override a registered setting
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSettingEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value: {}
    delete:
      summary: Reset a setting to its code default
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: key
        in: query
        schema:
          type: string
      responses:
        '200':
          description: reset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminSettingEnvelope"
  "/api/v1/admin/feature_flags":
    get:
      summary: List feature flags with defaults and rollout
      tags:
      - Admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminFeatureFlagList"
    patch:
      summary: Toggle a flag and set rollout
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminFeatureFlagEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                enabled:
                  type: boolean
                rollout:
                  type: object
                  additionalProperties: true
  "/api/v1/admin/translation_strings":
    get:
      summary: List the string catalogue
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: surface
        in: query
        required: false
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: listed
