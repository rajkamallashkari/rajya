    delete:
      summary: Remove the account password
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me/verify_password":
    post:
      summary: Confirm the current password for App Lock
      tags:
      - Credentials
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: matched
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
  "/api/v1/users/me/email":
    delete:
      summary: Remove the account email
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '409':
          description: last credential (F-8)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/users/me/google":
    delete:
      summary: Unlink Google from the account
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/messages":
    post:
      summary: Send a message
      tags:
      - Messages
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_id:
                  type: integer
                body:
                  type: string
                client_nonce:
                  type: string
                  format: uuid
                reply_to_message_id:
                  type: integer
                attachment_signed_ids:
                  type: array
                  items:
                    type: string
                poll:
                  type: object
                  properties:
                    question:
                      type: string
                    options:
                      type: array
                      items:
                        type: string
                    allows_multiple:
                      type: boolean
                    is_anonymous:
                      type: boolean
                    closes_at:
                      type: string
                      format: date-time
                location:
                  "$ref": "#/components/schemas/MessageLocation"
                silent:
                  type: boolean
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      contact_account_id:
                        type: integer
                        nullable: true
                      display_name:
                        type: string
                      phone:
                        type: string
                        nullable: true
                      email:
                        type: string
                        nullable: true
  "/api/v1/messages/{id}":
    patch:
      summary: Edit a message
      tags:
      - Messages
      security:
      - bearerAuth: []
      parameters:
      - name: id
