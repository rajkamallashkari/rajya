servers:
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
          - details
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        message:
          type: string
      required:
      - status
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        checks:
          type: object
          properties:
            postgres:
              "$ref": "#/components/schemas/HealthCheck"
            redis:
              "$ref": "#/components/schemas/HealthCheck"
            solid_queue:
              "$ref": "#/components/schemas/HealthCheck"
            r2:
              "$ref": "#/components/schemas/HealthCheck"
    Account:
      type: object
      required:
      - id
      - username
      - display_name
      - kind
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        kind:
          type: string
        bio:
          type: string
          nullable: true
        shared_memory:
          type: boolean
    CallParticipant:
      type: object
      required:
      - id
      - account_id
      - status
      - is_screen_sharing
      properties:
        id:
          type: integer
        account_id:
          type: integer
        status:
          type: string
        joined_at:
          type: string
          format: date-time
          nullable: true
        left_at:
          type: string
          format: date-time
          nullable: true
        is_screen_sharing:
          type: boolean
    Call:
      type: object
      required:
      - id
      - conversation_id
      - initiator_account_id
      - kind
      - status
      - participants
      - created_at
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        initiator_account_id:
          type: integer
        kind:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        participants:
          type: array
          items:
            "$ref": "#/components/schemas/CallParticipant"
    CallEnvelope:
      type: object
      properties:
        call:
          "$ref": "#/components/schemas/Call"
          nullable: true
        ice_servers:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
    IceServers:
      type: object
      required:
      - ice_servers
      properties:
        ice_servers:
          type: array
          items:
            type: object
            additionalProperties: true
    SessionUser:
      type: object
      required:
      - id
      - onboarded
      - has_password
      - has_passkey
      - phone_verified
      - is_admin
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        onboarded:
          type: boolean
        has_password:
          type: boolean
        has_passkey:
          type: boolean
        phone_verified:
          type: boolean
        is_admin:
          type: boolean
    Me:
      type: object
      required:
      - account
      - user
      properties:
        account:
          "$ref": "#/components/schemas/Account"
        user:
          "$ref": "#/components/schemas/SessionUser"
    UsernameAvailability:
      type: object
      required:
      - available
      properties:
        available:
          type: boolean
    Preferences:
      type: object
      required:
      - data
      - updated_at
      properties:
        data:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    Wallpaper:
      type: object
      required:
      - preset
      - dim
      - blur
      properties:
        preset:
          type: string
