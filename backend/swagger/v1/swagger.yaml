---
openapi: 3.0.1
info:
  title: Rajya API
  version: v1
  description: Rajya HTTP API. Generated from rswag-annotated request specs (TARGET
    §4.5).
paths:
  "/api/v1/accounts/username":
    get:
      summary: Check whether a username is available
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: username
        in: query
        schema:
          type: string
      responses:
        '200':
          description: availability
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UsernameAvailability"
  "/api/v1/accounts/{id}":
    get:
      summary: Show a public profile
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: visible
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '404':
          description: blocked (NR-1 invisibility)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/blocks":
    get:
      summary: List accounts the current account has blocked
      tags:
      - Blocks
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlockList"
    post:
      summary: Block an account
      tags:
      - Blocks
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: blocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Block"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
  "/api/v1/blocks/{id}":
    delete:
      summary: Unblock an account
      tags:
      - Blocks
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: unblocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/contact_nicknames":
    get:
      summary: List the current account's contact nicknames
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactNicknameList"
  "/api/v1/contact_nicknames/{account_id}":
    put:
      summary: Set a private nickname for a contact
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactNickname"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
    delete:
      summary: Remove a private nickname
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me/password":
    patch:
      summary: Set or change the current user's password
      tags:
      - Credentials
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: password set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
    delete:
      summary: Remove the account password
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me/verify_password":
    post:
      summary: Confirm the current password for App Lock
      tags:
      - Credentials
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: matched
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
  "/api/v1/users/me/email":
    delete:
      summary: Remove the account email
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '409':
          description: last credential (F-8)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/users/me/google":
    delete:
      summary: Unlink Google from the account
      tags:
      - Credentials
      security:
      - bearerAuth: []
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me/phone/verification":
    post:
      summary: Start WhatsApp click-to-verify (NR-9)
      tags:
      - Phone
      security:
      - bearerAuth: []
      responses:
        '200':
          description: code issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhoneVerification"
    get:
      summary: Phone verification status
      tags:
      - Phone
      security:
      - bearerAuth: []
      responses:
        '200':
          description: status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PhoneVerification"
  "/api/v1/admin/users/{user_id}/verify_phone":
    post:
      summary: Manually verify a phone number
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: verified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
  "/api/v1/sessions":
    get:
      summary: List active devices for the current user
      tags:
      - Sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeviceSessionList"
  "/api/v1/sessions/others":
    delete:
      summary: Sign out every other device
      tags:
      - Sessions
      security:
      - bearerAuth: []
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/sessions/{id}":
    delete:
      summary: Sign out one device
      tags:
      - Sessions
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me":
    get:
      summary: Show the current user and account
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: current profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
    patch:
      summary: 'Update the current profile (F-7: no phone)'
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                username:
                  type: string
                bio:
                  type: string
    delete:
      summary: Deactivate the current account (S-3)
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: deactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/users/me/complete_onboarding":
    post:
      summary: Stamp onboarded_at
      tags:
      - Users
      security:
      - bearerAuth: []
      responses:
        '200':
          description: onboarded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
  "/api/v1/users/me/email/change":
    post:
      summary: Request a verified email change
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthAccepted"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
  "/api/v1/users/me/email/verify":
    post:
      summary: Confirm a verified email change
      tags:
      - Users
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
  "/auth/google":
    post:
      summary: Sign in with a Google Identity Services auth code
      tags:
      - Auth
      description: GIS popup posts the auth code. JWT is returned in the body, never
        a redirect query string (F-25).
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '502':
          description: Google rejected the code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
  "/auth/magic_link/request":
    post:
      summary: Request a magic sign-in link
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: accepted whether or not the account exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthAccepted"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
  "/auth/magic_link/verify":
    post:
      summary: Consume a magic sign-in token
      tags:
      - Auth
      description: POST body, not a query string — the JWT never travels in a URL
        (F-25 class).
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: token invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
  "/auth/otp/request":
    post:
      summary: Request an email OTP
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: accepted for existing and missing accounts (F-24)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthAccepted"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
  "/auth/otp/verify":
    post:
      summary: Verify an email OTP
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: code invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
  "/auth/passkeys/authentication_options":
    post:
      summary: WebAuthn assertion options for sign-in
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: challenge issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnOptions"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
  "/auth/passkeys/authenticate":
    post:
      summary: Sign in with a WebAuthn assertion
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: unknown passkey
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nonce:
                  type: string
                credential:
                  "$ref": "#/components/schemas/WebauthnCredential"
  "/api/v1/passkeys":
    get:
      summary: List the current user's passkeys
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      responses:
        '200':
          description: listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PasskeyList"
        '401':
          description: unauthenticated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/passkeys/registration_options":
    post:
      summary: WebAuthn attestation options
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      responses:
        '200':
          description: challenge issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnOptions"
  "/api/v1/passkeys/register":
    post:
      summary: Register a WebAuthn credential
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Passkey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                credential:
                  "$ref": "#/components/schemas/WebauthnCredential"
  "/api/v1/passkeys/{id}":
    patch:
      summary: Rename a passkey
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: renamed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Passkey"
        '403':
          description: another user's passkey
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
    delete:
      summary: Remove a passkey
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
        '403':
          description: another user's passkey
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: last credential (F-8)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/passkeys/lock_options":
    post:
      summary: WebAuthn assertion options for App Lock
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      responses:
        '200':
          description: challenge issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnOptions"
  "/api/v1/passkeys/assert_lock":
    post:
      summary: Verify an App Lock assertion
      tags:
      - Passkeys
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: unlocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credential:
                  "$ref": "#/components/schemas/WebauthnCredential"
  "/auth/register":
    post:
      summary: Register with email and password
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '409':
          description: email taken
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                name:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
  "/auth/login":
    post:
      summary: Sign in with email and password
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
  "/auth/forgot_password":
    post:
      summary: Request a password reset email
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: accepted whether or not the account exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthAccepted"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
  "/auth/reset_password":
    post:
      summary: Consume a password reset token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: password updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: token invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
  "/up":
    get:
      summary: Liveness
      tags:
      - Operational
      description: Process is running. No dependency checks (NR-10).
      responses:
        '200':
          description: alive
  "/health":
    get:
      summary: Readiness
      tags:
      - Operational
      description: Postgres, Redis, Solid Queue heartbeat, and object storage (NR-10).
      responses:
        '200':
          description: ready
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '503':
          description: a dependency is down
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
  "/webhooks/whatsapp":
    get:
      summary: Meta hub challenge
      tags:
      - Webhooks
      parameters:
      - name: hub.mode
        in: query
        schema:
          type: string
      - name: hub.verify_token
        in: query
        schema:
          type: string
      - name: hub.challenge
        in: query
        schema:
          type: string
      responses:
        '200':
          description: subscribed
    post:
      summary: Inbound WhatsApp message
      tags:
      - Webhooks
      parameters: []
      responses:
        '200':
          description: accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
servers:
- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
          - details
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        message:
          type: string
      required:
      - status
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        checks:
          type: object
          properties:
            postgres:
              "$ref": "#/components/schemas/HealthCheck"
            redis:
              "$ref": "#/components/schemas/HealthCheck"
            solid_queue:
              "$ref": "#/components/schemas/HealthCheck"
            r2:
              "$ref": "#/components/schemas/HealthCheck"
    Account:
      type: object
      required:
      - id
      - username
      - display_name
      - kind
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        kind:
          type: string
        bio:
          type: string
          nullable: true
    SessionUser:
      type: object
      required:
      - id
      - onboarded
      - has_password
      - has_passkey
      - phone_verified
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        onboarded:
          type: boolean
        has_password:
          type: boolean
        has_passkey:
          type: boolean
        phone_verified:
          type: boolean
    Me:
      type: object
      required:
      - account
      - user
      properties:
        account:
          "$ref": "#/components/schemas/Account"
        user:
          "$ref": "#/components/schemas/SessionUser"
    UsernameAvailability:
      type: object
      required:
      - available
      properties:
        available:
          type: boolean
    PhoneVerification:
      type: object
      required:
      - status
      - phone_changed
      properties:
        code:
          type: string
          nullable: true
        wa_url:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        confirmed_phone:
          type: string
          nullable: true
        phone_changed:
          type: boolean
    Block:
      type: object
      required:
      - account
      properties:
        account:
          "$ref": "#/components/schemas/Account"
    BlockList:
      type: object
      required:
      - blocks
      properties:
        blocks:
          type: array
          items:
            "$ref": "#/components/schemas/Block"
    ContactNickname:
      type: object
      required:
