            application/json:
              schema:
                "$ref": "#/components/schemas/AdminTranslationStringList"
    patch:
      summary: Override a catalogue string
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminTranslationStringEnvelope"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                locale:
                  type: string
                value:
                  type: string
    delete:
      summary: Reset a catalogue string to its default
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: key
        in: query
        schema:
          type: string
      - name: locale
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: reset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminTranslationStringEnvelope"
  "/api/v1/admin/theme_overrides":
    get:
      summary: List semantic colour tokens
      tags:
      - Admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminThemeOverrideList"
    patch:
      summary: Set a semantic colour token
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminThemeOverrideEnvelope"
        '422':
          description: low contrast
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                token_name:
                  type: string
                value:
                  type: string
    delete:
      summary: Reset colour tokens
      tags:
      - Admin
      security:
      - bearerAuth: []
      parameters:
      - name: theme
        in: query
        required: false
        schema:
          type: string
      - name: token_name
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: reset
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminThemeOverrideList"
  "/api/v1/theme_overrides":
