---
openapi: 3.0.1
info:
  title: Rajya API
  version: v1
  description: Rajya HTTP API. Generated from rswag-annotated request specs (TARGET
    §4.5).
paths:
  "/api/v1/accounts/username":
    get:
      summary: Check whether a username is available
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: username
        in: query
        schema:
          type: string
      responses:
        '200':
          description: availability
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UsernameAvailability"
  "/api/v1/accounts/{id}":
    get:
      summary: Show a public profile
      tags:
      - Accounts
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: visible
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '404':
          description: blocked (NR-1 invisibility)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/blocks":
    get:
      summary: List accounts the current account has blocked
      tags:
      - Blocks
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BlockList"
    post:
      summary: Block an account
      tags:
      - Blocks
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: blocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Block"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: integer
  "/api/v1/blocks/{id}":
    delete:
      summary: Unblock an account
      tags:
      - Blocks
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: unblocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/contact_nicknames":
    get:
      summary: List the current account's contact nicknames
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      responses:
        '200':
          description: list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactNicknameList"
  "/api/v1/contact_nicknames/{account_id}":
    put:
      summary: Set a private nickname for a contact
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactNickname"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
    delete:
      summary: Remove a private nickname
      tags:
      - Contact nicknames
      security:
      - bearerAuth: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Ok"
  "/api/v1/conversations/{conversation_id}/messages":
    get:
      summary: List messages in a conversation
      tags:
      - Messages
      security:
      - bearerAuth: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: integer
      - name: before
        in: query
        required: false
        schema:
          type: integer
      - name: after
        in: query
        required: false
        schema:
          type: integer
      - name: around_id
        in: query
        required: false
        schema:
          type: integer
      - name: around_at
        in: query
        format: date_time
        required: false
        schema:
          type: string
      responses:
        '200':
          description: jump around id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagePage"
        '404':
          description: unknown pivot
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/messages/{id}/info":
    get:
      summary: Message delivery and read info
      tags:
      - Messages
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: info
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageInfo"
  "/api/v1/conversations":
    get:
      summary: List the current account's conversations
      tags:
      - Conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          description: sidebar
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConversationList"
    post:
      summary: Create a conversation
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: group created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Conversation"
        '404':
          description: blocked new DM (NR-1)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                account_id:
                  type: integer
  "/api/v1/conversations/{id}":
    get:
      summary: Show a conversation
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: shown
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Conversation"
        '404':
          description: not a member
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Update conversation info
      tags:
      - Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: description only
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Conversation"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
  "/api/v1/users/me/password":
    patch:
      summary: Set or change the current user's password
      tags:
      - Credentials
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: password set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
