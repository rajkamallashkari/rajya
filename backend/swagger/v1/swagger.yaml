- url: http://localhost:3000
  description: Local development
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          required:
          - code
          - message
          - details
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        message:
          type: string
      required:
      - status
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - error
        checks:
          type: object
          properties:
            postgres:
              "$ref": "#/components/schemas/HealthCheck"
            redis:
              "$ref": "#/components/schemas/HealthCheck"
            solid_queue:
              "$ref": "#/components/schemas/HealthCheck"
            r2:
              "$ref": "#/components/schemas/HealthCheck"
    Account:
      type: object
      required:
      - id
      - username
      - display_name
      - kind
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        kind:
          type: string
        bio:
          type: string
          nullable: true
    SessionUser:
      type: object
      required:
      - id
      - onboarded
      - has_password
      - has_passkey
      - phone_verified
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        onboarded:
          type: boolean
        has_password:
          type: boolean
        has_passkey:
          type: boolean
        phone_verified:
          type: boolean
    Me:
      type: object
      required:
      - account
      - user
      properties:
        account:
          "$ref": "#/components/schemas/Account"
        user:
          "$ref": "#/components/schemas/SessionUser"
    UsernameAvailability:
      type: object
      required:
      - available
      properties:
        available:
          type: boolean
    PhoneVerification:
      type: object
      required:
      - status
      - phone_changed
      properties:
        code:
          type: string
          nullable: true
        wa_url:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        confirmed_phone:
          type: string
          nullable: true
        phone_changed:
          type: boolean
    Block:
      type: object
      required:
      - account
      properties:
        account:
          "$ref": "#/components/schemas/Account"
    BlockList:
      type: object
      required:
      - blocks
      properties:
        blocks:
          type: array
          items:
            "$ref": "#/components/schemas/Block"
    ContactNickname:
      type: object
      required:
      - nickname
      - account
      properties:
        nickname:
          type: string
        account:
          "$ref": "#/components/schemas/Account"
    ContactNicknameList:
      type: object
      required:
      - nicknames
      properties:
        nicknames:
          type: array
          items:
            "$ref": "#/components/schemas/ContactNickname"
    DeviceSession:
      type: object
      required:
      - id
      - last_seen_at
      - expires_at
      - current
      - revoked
      properties:
        id:
          type: integer
        device_label:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
        revoked:
          type: boolean
    DeviceSessionList:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            "$ref": "#/components/schemas/DeviceSession"
    Session:
      type: object
      required:
      - token
